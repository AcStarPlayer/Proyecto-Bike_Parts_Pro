<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo | BikePartsPro</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="../../componentes/styles.css" />
    <link rel="stylesheet" href="./catalogo.css" />
  </head>

  <body class="d-flex flex-column min-vh-100">
    <div class="text-center mt-5 mb-2">
      <h2 class="fw-bold">Catálogo</h2>
    </div>

    <section class="catalogo-filtros py-3 px-4">
      <p class="text-center text-muted small fw-semibold mb-2 text-uppercase ls-1">Filtrar por categoría</p>
      <div class="d-flex flex-wrap gap-2 justify-content-center" id="filtros"></div>
    </section>

    <section class="catalogo-section py-3">
      <div class="container">
        <div
          class="row g-4 justify-content-center align-items-center"
          id="catalogo"
        ></div>
      </div>
    </section>

    <div class="mt-4 mb-4" id="paginacion"></div>
    <div id="footer" class="mt-auto"></div>

    <script type="module" src="./catalogo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
