<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo | BikePartsPro</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Source+Sans+3:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="../../componentes/styles.css" />
    <link rel="stylesheet" href="./catalogo.css" />
  </head>

  <body class="d-flex flex-column min-vh-100">

    <div id="navbar-catalogo"></div>

    <div class="container-fluid flex-grow-1 py-5 px-3 px-md-4 position-relative">
      <div class="row g-3 align-items-start">

        <aside class="col-12 col-md-3 col-xl-2">
          <div class="catalogo-sidebar">
            <p class="sidebar-titulo">
              <i class="bi bi-funnel-fill me-1"></i> Categorías
            </p>
            <div id="filtros" class="list-group list-group-flush"></div>
          </div>
        </aside>

        <main class="col-12 col-md-9 col-xl-10">
          <div class="row g-4 justify-content-start" id="catalogo"></div>
          <div class="mt-4 mb-2" id="paginacion"></div>
        </main>

      </div>
    </div>

    <div id="footer" class="mt-auto"></div>

    <script type="module" src="./catalogo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
