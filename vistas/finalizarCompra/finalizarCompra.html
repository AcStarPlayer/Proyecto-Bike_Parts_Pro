<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finalizar Compra | BikeParts PRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="../../componentes/styles.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="shortcut icon" href="../../img/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>

  <body class="d-flex flex-column min-vh-100">

    <main class="checkout-page flex-grow-1" id="checkout-main">
      <div class="container py-4">

        <div class="checkout-stepper">
          <div class="step step--active">
            <div class="step-circle">1</div>
            <span>Envío</span>
          </div>
          <div class="step-line"></div>
          <div class="step">
            <div class="step-circle">2</div>
            <span>Pago</span>
          </div>
          <div class="step-line"></div>
          <div class="step">
            <div class="step-circle">3</div>
            <span>Revisión</span>
          </div>
        </div>

        <div class="checkout-layout">

          <div class="checkout-forms">
            <div class="checkout-card">
              <h3 class="checkout-card-title">
                <i class="bi bi-truck"></i> Dirección de Envío
              </h3>
              <form id="form-checkout">
                <div class="form-group">
                  <label>Nombre Completo</label>
                  <input type="text" class="checkout-input" placeholder="Ej. Juan Pérez" required />
                </div>
                <div class="form-group">
                  <label>Calle y Número</label>
                  <input type="text" class="checkout-input" placeholder="Dirección exacta" required />
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>Ciudad</label>
                    <input type="text" class="checkout-input" placeholder="Ciudad" required />
                  </div>
                  <div class="form-group">
                    <label>Departamento / Estado</label>
                    <input type="text" class="checkout-input" placeholder="Provincia / Estado" required />
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>Complemento <span class="opcional">(Opcional)</span></label>
                    <input type="text" class="checkout-input" placeholder="Piso, Apto, etc." />
                  </div>
                  <div class="form-group">
                    <label>Código Postal</label>
                    <input type="text" class="checkout-input" placeholder="CP" required />
                  </div>
                </div>
              </form>
            </div>

            <div class="checkout-card">
              <h3 class="checkout-card-title">
                <i class="bi bi-credit-card"></i> Método de Pago
              </h3>
              <div id="opciones-pago">
                <label class="opcion-pago activa">
                  <div class="opcion-pago-info">
                    <i class="bi bi-credit-card-2-front"></i>
                    <div>
                      <p>Tarjeta de Crédito / Débito</p>
                      <small>Visa, Mastercard, Amex</small>
                    </div>
                  </div>
                  <input type="radio" name="pago" value="tarjeta" checked />
                </label>
                <label class="opcion-pago">
                  <div class="opcion-pago-info">
                    <i class="bi bi-paypal"></i>
                    <div>
                      <p>PayPal</p>
                      <small>Paga de forma segura</small>
                    </div>
                  </div>
                  <input type="radio" name="pago" value="paypal" />
                </label>
                <label class="opcion-pago">
                  <div class="opcion-pago-info">
                    <i class="bi bi-bank"></i>
                    <div>
                      <p>Transferencia Bancaria</p>
                      <small>Procesamiento en 24-48h</small>
                    </div>
                  </div>
                  <input type="radio" name="pago" value="transferencia" />
                </label>
              </div>
            </div>
          </div>

          <div class="checkout-summary-sticky">
            <div class="checkout-card">
              <h3 class="checkout-card-title">Resumen del pedido</h3>
              <div id="resumen-items" class="resumen-items"></div>
              <div class="resumen-totales">
                <div class="resumen-linea">
                  <span>Subtotal</span>
                  <span id="resumen-subtotal">$0</span>
                </div>
                <div class="resumen-linea">
                  <span>Gastos de envío</span>
                  <span class="text-accent">Gratis</span>
                </div>
                <div class="resumen-linea">
                  <span>IVA (19%)</span>
                  <span id="resumen-iva">$0</span>
                </div>
                <div class="resumen-linea resumen-total">
                  <span>Total a pagar</span>
                  <span id="resumen-total">$0</span>
                </div>
              </div>
              <button type="submit" form="form-checkout" class="btn-finalizar-checkout">
                <i class="bi bi-lock-fill"></i> Finalizar Compra
              </button>
              <p class="seguridad-badge">
                <i class="bi bi-shield-check"></i> Pago 100% seguro y encriptado
              </p>
            </div>
          </div>

        </div>
      </div>
    </main>

    <div id="footer" class="mt-auto"></div>

    <script type="module" src="finalizarCompra.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
